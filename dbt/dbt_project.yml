name: solar_compliance
version: "1.0.0"
config-version: 2
profile: solar_compliance

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # A 5-minute interval counts as a production window when the median normalized
  # power of the site's reporting inverters is at least this value.
  sun_up_threshold: 0.10
  # Inverters needed to judge an interval by peer comparison.
  min_peers: 3
  # Inside a production window, an inverter below this normalized power is down.
  down_threshold: 0.02
  # Site-wide outage: every inverter near zero while the site's typical output
  # for that month and time of day is at least typical_production_threshold.
  site_outage_norm: 0.005
  typical_production_threshold: 0.30
  # Robust nameplate proxy: this quantile of an inverter's observed AC power.
  capacity_quantile: 0.995
  # An outage becomes a service ticket after this many consecutive down intervals.
  min_event_intervals: 6
  # Inverter-month performance index below this opens an underperformance ticket.
  underperformance_threshold: 0.90
  min_available_intervals_for_performance: 300
  # A site-month is judged against the contract only with this much data coverage.
  min_month_data_coverage: 0.50

models:
  solar_compliance:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

seeds:
  solar_compliance:
    contract_terms:
      +column_types:
        site_id: integer
        min_time_availability: double
        min_energy_availability: double
        min_data_availability: double
        max_restore_hours: double
        ld_rate_usd_per_kwh: double
