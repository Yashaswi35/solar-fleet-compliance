version: 2

sources:
  - name: pvdaq
    description: >
      5-minute inverter AC power produced by ingest/load.py from the NREL PVDAQ
      2023 Solar Data Prize files (public, OEDI data lake).
    meta:
      external_location: "read_parquet('{{ env_var('FLEET_PROCESSED', 'data/processed') }}/{name}/*/*.parquet', hive_partitioning = false)"
    tables:
      - name: inverter_power
        columns:
          - name: site_id
          - name: inverter_id
          - name: ts
          - name: ac_kw
