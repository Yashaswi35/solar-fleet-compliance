name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["reports/**", "**.md"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: End-to-end tests (fixtures with injected faults, dbt build and tests)
        env:
          DBT_USE_COLORS: "false"
        run: pytest -q
