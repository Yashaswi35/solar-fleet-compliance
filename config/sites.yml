# Fleet definition: NREL PVDAQ 2023 Solar Data Prize sites (public, US).
# Source bucket: s3://oedi-data-lake (anonymous HTTPS access).
#
# layout:
#   wide_power          one CSV holds AC power for many inverters (one column per inverter)
#   per_inverter_energy one CSV per inverter holding AC energy (kWh) per reading
#
# The value regex must capture the inverter identifier in group 1.
#
# Excluded after validation: site 2105 (Maui Ocean Center, 110 kW DC rooftop).
# Its 11 channels are strings on roof faces with varying azimuth and tilt, so
# comparing each against its peers is not meaningful, and its "kWh" channel did
# not convert to power consistent with the 110 kW system size.

base_url: https://oedi-data-lake.s3.amazonaws.com
raw_dir: data/raw
processed_dir: data/processed

sites:
  - site_id: 2107
    label: Farm Solar Array, Arbuckle CA (893 kW DC, 24 x ABB TRIO-27.6, fixed tilt)
    layout: wide_power
    timestamp_column: measured_on
    value_regex: '^inv_(\d+)_ac_power_inv_\d+$'
    power_units: kW
    prefix: pvdaq/2023-solar-data-prize/2107_OEDI
    files:
      - data/2107_electrical_data.csv
      - data/2107_electrical_data_2024.csv
      - data/2107_electrical_data_2025.csv
    irradiance:
      value_regex: '^poa_irradiance'
      files:
        - data/2107_irradiance_data.csv
        - data/2107_irradiance_data_2024.csv
        - data/2107_irradiance_15m_data_2025.csv
    metadata: metadata/2107_system_metadata.json

  - site_id: 9068
    label: Site 9068 (single-axis tracker)
    layout: wide_power
    timestamp_column: measured_on
    value_regex: '(?i)^inv(?:erter)?[_ ]?([\d.]+)_.*ac_?power'
    power_units: kW
    prefix: pvdaq/2023-solar-data-prize/9068_OEDI
    files:
      - data/9068_ac_power_data.csv
      - data/9068_ac_power_data_20240101_20250430.csv
    irradiance:
      value_regex: 'poa'
      files:
        - data/9068_irradiance_data.csv
        - data/9068_irradiance_data_20240101_20250430.csv
    metadata: metadata/9068_system_metadata.json
